name: FlipperHero
options:
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
  DebugStore: debug
  ReleaseStore: release
settings:
  base:
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
  configs:
    # Store edition: strips the red team capabilities at compile time. The OSS
    # editions (Debug, Release) keep everything; there is no runtime switch.
    DebugStore:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DEBUG FLIPPERHERO_STORE
    ReleaseStore:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) FLIPPERHERO_STORE
  createIntermediateGroups: true
packages:
  FlipperHero:
    path: .
targets:
  FlipperHero:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - package: FlipperHero
        product: FlipperKit
      - package: FlipperHero
        product: AgentKit
      - target: FlipperHeroWidgets
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: FlipperHero
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "2"
        NSBluetoothAlwaysUsageDescription: FlipperHero connects to your Flipper Zero over Bluetooth.
        NSMicrophoneUsageDescription: Speak to the agent instead of typing.
        NSSpeechRecognitionUsageDescription: Your spoken message is turned into text for the agent.
        NSCameraUsageDescription: Show the agent a remote, a label or a device so it can help identify it.
        NSPhotoLibraryUsageDescription: Attach a picture from your library to a message.
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIBackgroundModes:
          - bluetooth-central
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    scheme:
      testTargets:
        - FlipperHeroTests
        - FlipperHeroUITests
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
      DebugStore: Config/Base.xcconfig
      ReleaseStore: Config/Base.xcconfig
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        PROVISIONING_PROFILE_SPECIFIER: $(APP_PROVISIONING_PROFILE)
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
  FlipperHeroWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: FlipperHero
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "2"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
      DebugStore: Config/Base.xcconfig
      ReleaseStore: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).Widgets
        PROVISIONING_PROFILE_SPECIFIER: $(WIDGET_PROVISIONING_PROFILE)
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
  FlipperHeroTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AppTests
    dependencies:
      - target: FlipperHero
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
      DebugStore: Config/Base.xcconfig
      ReleaseStore: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).Tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
  FlipperHeroUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: FlipperHero
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
      DebugStore: Config/Base.xcconfig
      ReleaseStore: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).UITests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"

# Store edition: same sources, capabilities compiled out. Archive with this scheme.
schemes:
  FlipperHeroStore:
    build:
      targets:
        FlipperHero: all
    run:
      config: DebugStore
    archive:
      config: ReleaseStore
